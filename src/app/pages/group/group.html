<h1>Group</h1>

<div class="group-container">

    <p-card class="total-card">

        <h3>Total</h3>
        <h1>{{display.N}}</h1>

    </p-card>


<p-toast></p-toast>

<p-card header="Crear Grupo">
    <div class="form-container">
        
        <div class="field">
            <label for="id">ID del Grupo</label>
            <input pInputText id="id" placeholder="Ej: 101" [(ngModel)]="nuevoGrupo.id">
        </div>

        <div class="field">
            <label for="nombre">Nombre</label>
            <input pInputText id="nombre" placeholder="Nombre del grupo" [(ngModel)]="nuevoGrupo.nombre">
        </div>

        <div class="field">
            <label for="categoria">Categoría</label>
            <input pInputText id="categoria" placeholder="Ej: Social, Académico" [(ngModel)]="nuevoGrupo.categoria">
        </div>

        <div class="field">
            <label for="nivel">Nivel</label>
            <input pInputText id="nivel" placeholder="Nivel" [(ngModel)]="nuevoGrupo.nivel">
        </div>

        <div class="field">
            <label for="autor">Autor</label>
            <input pInputText id="autor" placeholder="Nombre del autor" [(ngModel)]="nuevoGrupo.autor">
        </div>

        <div class="field">
            <label for="miembros">Miembros</label>
            <input pInputText id="miembros" placeholder="Cantidad de miembros" [(ngModel)]="nuevoGrupo.miembros">
        </div>

        <div class="field">
            <label for="tickets">Tickets</label>
            <input pInputText id="tickets" placeholder="Número de tickets" [(ngModel)]="nuevoGrupo.tickets">
        </div>

        <div class="button-row">
            <button pButton label="Agregar Grupo" icon="pi pi-plus" (click)="agregar()"></button>
        </div>

    </div>
</p-card>

<p-card header="Lista de Grupos">

<p-table [value]="grupos">

<ng-template pTemplate="header">
<tr>
<th>ID</th>
<th>Nombre</th>
<th>Categoría</th>
<th>Nivel</th>
<th>Autor</th>
<th>Miembros</th>
<th>Tickets</th>
<th>Acciones</th>
</tr>
</ng-template>

<ng-template pTemplate="body" let-grupo>
<tr>
<td>{{grupo.id}}</td>
<td>{{grupo.nombre}}</td>
<td>{{grupo.categoria}}</td>
<td>{{grupo.nivel}}</td>
<td>{{grupo.autor}}</td>
<td>{{grupo.miembros}}</td>
<td>{{grupo.tickets}}</td>

<td>
<button
pButton
icon="pi pi-trash"
severity="danger"
(click)="eliminar(grupo)">
</button>
</td>

</tr>
</ng-template>

</p-table>

</p-card>

</div>
