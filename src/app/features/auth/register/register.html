<div class="center">
  <p-card header="Registro de Usuario">

    <div class="field">
      <label>Nombre</label>
      <input pInputText
             [ngModel]="name()"
             (ngModelChange)="name.set($event)" />
    </div>

    <div class="field">
      <label>Email</label>
      <input pInputText type="email"
             [ngModel]="email()"
             (ngModelChange)="email.set($event)" />
    </div>

    <div class="field">
      <label>Password</label>
      <input pInputText type="password"
             [ngModel]="password()"
             (ngModelChange)="password.set($event)" />
    </div>

    <button pButton label="Registrarse"
            class="full-width"
            (click)="register()">
    </button>

    <div class="link">
      <a routerLink="/login">¿Ya tienes cuenta?</a>
    </div>

  </p-card>
</div><p>register works!</p>
